name: Ingest RSS inbox

# This repository is Dylan's personal site. The hourly ingest used to feed a
# network console that no longer publishes here. Tech Briefing lives at
# https://thetechbriefing.com. Run the old pipeline only on purpose.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ingestion pipeline
        run: python3 scripts/run_ingest.py
      - name: Commit inbox and intelligence artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ingest/rss-inbox.json \
                  data/ingest/sources.json \
                  data/intelligence/articles.json \
                  data/intelligence/articles-archive.json \
                  data/intelligence/events.json \
                  data/intelligence/entity-registry.json \
                  data/intelligence/price-action.json \
                  data/intelligence/reactions.json \
                  data/intelligence/observations/price.json \
                  data/intelligence/observations/prediction_markets.json \
                  data/intelligence/observations/probabilities.json \
                  data/intelligence.json
          git diff --cached --quiet || git commit -m 'Update RSS inbox and intelligence artifacts'
          git push
