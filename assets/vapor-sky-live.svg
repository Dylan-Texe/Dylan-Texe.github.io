<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070314"/>
      <stop offset="0.22" stop-color="#100624"/>
      <stop offset="0.42" stop-color="#241046"/>
      <stop offset="0.58" stop-color="#5a1464"/>
      <stop offset="0.7" stop-color="#e23186"/>
      <stop offset="0.8" stop-color="#4a1038"/>
      <stop offset="1" stop-color="#0c0618"/>
    </linearGradient>
    <radialGradient id="nebulaL" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6a32ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6a32ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2f9a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff2f9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="0.26" stop-color="#ff4d8a" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#c026d3" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sundisc" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="0.18" stop-color="#ffc15a"/>
      <stop offset="0.46" stop-color="#ff6428"/>
      <stop offset="0.74" stop-color="#ff2d78"/>
      <stop offset="1" stop-color="#d01088"/>
    </radialGradient>
    <radialGradient id="planet" cx="36%" cy="34%" r="70%">
      <stop offset="0" stop-color="#d2c6ff"/>
      <stop offset="0.32" stop-color="#6d4dff"/>
      <stop offset="0.7" stop-color="#2a1468"/>
      <stop offset="1" stop-color="#12061f"/>
    </radialGradient>
    <pattern id="dither" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="1.3" height="1.3" fill="#ff4fd8"/>
      <rect x="3" y="3" width="1.3" height="1.3" fill="#ffb15a"/>
    </pattern>
    <linearGradient id="ditherfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dithermask">
      <rect x="0" y="500" width="1600" height="150" fill="url(#ditherfade)"/>
    </mask>
    <mask id="sunmask">
      <rect width="1600" height="900" fill="black"/>
      <circle cx="800" cy="236" r="172" fill="white"/>
      <rect x="590" y="268" width="420" height="6" fill="black"/>
      <rect x="580" y="288" width="440" height="8" fill="black"/>
      <rect x="570" y="314" width="460" height="11" fill="black"/>
      <rect x="560" y="346" width="480" height="15" fill="black"/>
      <rect x="548" y="384" width="504" height="20" fill="black"/>
      <rect x="536" y="428" width="528" height="28" fill="black"/>
    </mask>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="260" cy="200" rx="280" ry="160" fill="url(#nebulaL)"/>
  <ellipse cx="1280" cy="150" rx="240" ry="130" fill="url(#nebulaR)"/>
  <ellipse cx="800" cy="548" rx="760" ry="78" fill="#ff3d92" opacity="0.22"/>
  <ellipse cx="800" cy="236" rx="360" ry="260" fill="url(#sunglow)"/>
  <g mask="url(#sunmask)">
    <circle cx="800" cy="236" r="172" fill="url(#sundisc)"/>
  </g>
  <circle cx="800" cy="236" r="198" fill="none" stroke="#ffd0f2" stroke-width="1.2" opacity="0.4"/>
  <g fill="none" stroke-width="1.25">
    <path d="M36 92H220" stroke="#3df0ff" opacity="0.5"/>
    <path d="M58 108H176" stroke="#3df0ff" opacity="0.35"/>
    <path d="M1372 64H1554" stroke="#ff4fd8" opacity="0.45"/>
    <path d="M1410 80H1570" stroke="#ff4fd8" opacity="0.3"/>
  </g>
  <rect x="0" y="500" width="1600" height="150" fill="url(#dither)" mask="url(#dithermask)" opacity="0.45"/>
  <rect x="0" y="608" width="1600" height="2" fill="#ff4fd8"/>
  <rect x="0" y="612" width="1600" height="1" fill="#7af6ff" opacity="0.8"/>
</svg>
